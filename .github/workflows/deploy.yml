name: Deploy

on:
  push:
    branches: [main]
    # 배포하면 메모리의 방이 전부 사라지므로 문서 수정만으로는 재시작하지 않는다
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_ARCHIVE: the-gang-server.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # VM의 guest agent가 멈춰 있어 gcloud의 메타데이터 키 등록은 쓸 수 없다. 고정 키로 접속한다
      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          for name in VM_HOST VM_SSH_USER VM_SSH_KEY VM_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is not set"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $VM_HOST
            User $VM_SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Build image
        run: |
          docker build --platform linux/amd64 -t the-gang-server:latest .
          docker save the-gang-server:latest | gzip > "$IMAGE_ARCHIVE"

      - name: Upload image
        run: scp "$IMAGE_ARCHIVE" vm:/tmp/

      - name: Restart container
        run: |
          ssh vm bash -s <<'EOF'
          set -eu
          test -f ~/.env.production
          # 이미지 로드가 실패하면 기존 컨테이너는 그대로 두기 위해 먼저 로드한다
          gunzip -c /tmp/the-gang-server.tar.gz | docker load
          rm -f /tmp/the-gang-server.tar.gz
          docker stop the-gang-server 2>/dev/null || true
          docker rm the-gang-server 2>/dev/null || true
          # 로그 제한이 없으면 작은 VM 디스크에 컨테이너 로그가 계속 쌓인다
          docker run -d --name the-gang-server --restart=always -p 9030:9030 \
            --log-opt max-size=10m --log-opt max-file=3 \
            --env-file ~/.env.production the-gang-server:latest
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9030/api >/dev/null 2>&1; then
              docker image prune -f >/dev/null
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not respond on /api" >&2
          docker logs --tail 50 the-gang-server >&2
          exit 1
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # 로그는 job이 끝나야 조회되므로 별도 job으로 분리한다
  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Send Telegram message
        env:
          SERVICE: 서버
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets are not set"
            exit 0
          fi

          commit=${COMMIT_MESSAGE%%$'\n'*}
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          summary="커밋: ${GITHUB_SHA::7} ${commit:-수동 실행}"

          if [ "$DEPLOY_RESULT" = "success" ]; then
            text=$(printf '✅ %s 배포 성공\n%s\n%s' "$SERVICE" "$summary" "$run_url")
          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            text=$(printf '⚠️ %s 배포 취소\n%s\n%s' "$SERVICE" "$summary" "$run_url")
          else
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "deploy")' || true)
            job_id=$(jq -r '.id // empty' <<<"$job")
            failed_step=$(jq -r '[.steps[]? | select(.conclusion == "failure") | .name] | first // empty' <<<"$job")

            log=""
            for _ in 1 2 3 4; do
              [ -n "$job_id" ] || break
              log=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" 2>/dev/null || true)
              [ -z "$log" ] || break
              sleep 5
            done
            log=$(cut -d' ' -f2- <<<"$log")
            exit_code=$(grep -oE 'exit code [0-9]+' <<<"$log" | tail -n 1 | grep -oE '[0-9]+' || true)
            error_line=$(grep -n -m 1 '##\[error\]' <<<"$log" | cut -d: -f1 || true)
            detail=$(head -n "${error_line:-0}" <<<"$log" | tail -n 15 | cut -c1-200 | head -c 2800 | iconv -c -f utf-8 -t utf-8 || true)

            text=$(printf '❌ %s 배포 실패\n%s\n실패 단계: %s\n종료 코드: %s\n\n%s\n\n%s' \
              "$SERVICE" "$summary" "${failed_step:-알 수 없음}" "${exit_code:-없음}" "$detail" "$run_url")
          fi

          curl -fsS --retry 3 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            || echo "::warning::Telegram notification failed"
